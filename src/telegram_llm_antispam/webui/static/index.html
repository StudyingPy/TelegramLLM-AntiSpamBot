<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>指纹复核台</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="static/app.css">
<script src="static/app.js" defer></script>
</head>
<body>
<div id="app" class="app" aria-busy="true">
  <div class="boot" id="boot">
    <p class="boot-title">指纹复核台</p>
    <p class="boot-text" id="boot-text">正在验证身份……</p>
  </div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
<noscript><p class="boot-text">请启用 JavaScript 后再打开复核台。</p></noscript>
</body>
</html>
